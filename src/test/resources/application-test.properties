spring.application.name=uetlib-job-test

logging.pattern.level=%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]

spring.jpa.open-in-view=false

spring.docker.compose.enabled=false

spring.flyway.locations=classpath:/db/migration/templates/{vendor}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

ch.uetlib.job.test.sql-locations=sql/{vendor}/insert_jobs.sql

ch.uetlib.job.job-state-watcher.check-jobs-running.cron=-

ch.uetlib.spring.boot.http.default-user-agent=uetlib-job-test