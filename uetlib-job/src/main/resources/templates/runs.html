<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="en">
<!--suppress HtmlRequiredTitleElement -->
<head th:replace="fragments/head :: head">
    <!-- HEAD -->
</head>
<body ondragstart="" onselectstart="" ontouchcancel="" ontouchstart="" touchend="" touchmove="">
<nav th:replace="fragments/navbar :: navbar('runs')">
    <!-- Header -->
</nav>
<div class="container-fluid">
    <div class="row">
        <main class="col pt-3">
            <h1>Job Runs</h1>

            <div class="row g-2">
                <div class="col-sm">
                    <div class="form-floating">
                        <select id="jobFilter" class="form-select">
                            <option value="-">-</option>
                            <option th:each="job : ${jobs}"
                                    th:selected="${jobNameSelected.get(job.name)}"
                                    th:value="${job.name}"
                                    th:text="${job.name}">
                            </option>
                        </select>
                        <label for="jobFilter">Filter by Type:</label>
                    </div>
                </div>
                <div class="col-sm">
                    <div class="form-floating">
                        <select id="stateFilter" class="form-select">
                            <option value="-">-</option>
                            <option th:each="state : ${states}"
                                    th:selected="${stateSelected.get(state)}"
                                    th:value="${state}"
                                    th:text="${state}">
                            </option>
                        </select>
                        <label for="stateFilter">Filter by State:</label>
                    </div>
                </div>
            </div>

            <div class="table-responsive" id="log-table">
                <table class="table table-striped table-sm">
                    <thead>
                    <tr>
                        <th>Type</th>
                        <th>Started at</th>
                        <th>Finished at</th>
                        <th>Run Time</th>
                        <th>State</th>
                        <th>Log output</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="jobRun : ${jobRuns}">
                        <td th:text="${jobIdToName.get(jobRun.jobId)}"></td>
                        <td th:text="${jobRun.startedAt}"></td>
                        <td th:text="${jobRun.finishedAt}"></td>
                        <td th:text="${jobRunDurations.get(jobRun.id)}"></td>
                        <td th:text="${jobRun.state}"></td>
                        <td>
                            <a th:href="@{/status/runs/{runId}/log(runId=${jobRun.id})}"
                               class="logLink" target="_blank">Log</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
                <nav>
                    <ul class="pagination">
                        <li class="page-item" th:classappend="${isFirst} ? 'disabled' : ''"
                            th:disabled="${isFirst}">
                            <button class="page-link" id="prev-page" th:disabled="${isFirst}">
                                Previous
                            </button>
                        </li>
                        <li class="page-item active" aria-current="page">
                            <button class="page-link" id="current-page" th:data-page="${page}"
                                    th:text="${prettyPage}"></button>
                        </li>
                        <li class="page-item" th:classappend="${isLast} ? 'disabled' : ''"
                            th:disabled="${isLast}">
                            <button class="page-link" id="next-page" th:disabled="${isLast}">Next
                            </button>
                        </li>
                    </ul>
                </nav>
            </div>
        </main>
    </div>
</div>
<footer th:replace="fragments/footer :: footer">
    <!-- FOOTER -->
</footer>

</body>
</html>
