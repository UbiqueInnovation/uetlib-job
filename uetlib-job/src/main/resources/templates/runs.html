<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="en">
<!--suppress HtmlRequiredTitleElement -->
<head th:replace="fragments/head :: head">
    <!-- HEAD -->
</head>
<body>
<nav th:replace="fragments/navbar :: navbar('runs')">
    <!-- Header -->
</nav>
<div class="container-fluid my-3">
    <div class="row g-3">
        <div class="col-6">
            <div class="form-floating">
                <select id="jobFilter" class="form-select">
                    <option value="-">-</option>
                    <option th:each="job : ${jobs}"
                            th:selected="${jobNameSelected.get(job.name)}"
                            th:value="${job.name}"
                            th:text="${job.name}">
                    </option>
                </select>
                <label for="jobFilter">Filter by Job:</label>
            </div>
        </div>
        <div class="col-6">
            <div class="form-floating">
                <select id="stateFilter" class="form-select">
                    <option value="-">-</option>
                    <option th:each="state : ${states}"
                            th:selected="${stateSelected.get(state)}"
                            th:value="${state}"
                            th:text="${state}">
                    </option>
                </select>
                <label for="stateFilter">Filter by State:</label>
            </div>
        </div>
        <div class="table-responsive col-12">
            <table class="table table-bordered table-striped table-sm m-0">
                <thead>
                <tr>
                    <th>Run ID</th>
                    <th>Job Name</th>
                    <th>Started at</th>
                    <th>Finished at</th>
                    <th class="text-end">Duration</th>
                    <th class="text-center">State</th>
                    <th class="text-center">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="jobRun : ${jobRuns}">
                    <td class="align-middle text-center" th:text="${jobRun.id}"></td>
                    <td class="align-middle" th:text="${jobIdToName.get(jobRun.jobId)}"></td>
                    <td class="align-middle"
                        th:text="${#temporals.format(jobRun.startedAtZoned, 'dd. MMM. yyyy HH:mm')}"></td>
                    <td class="align-middle"
                        th:text="${#temporals.format(jobRun.finishedAtZoned, 'dd. MMM. yyyy HH:mm')}"></td>
                    <td class="align-middle text-end" th:text="${jobRunDurations.get(jobRun.id)}"></td>
                    <td class="align-middle text-center">
                        <span th:class="'badge bg-'+${jobRunStateColors.get(jobRun.state)}"
                              th:text="${jobRun.state}"/>
                    </td>
                    <td class="align-middle text-center">
                        <a th:href="@{/status/runs/{runId}/log(runId=${jobRun.id})}"
                           class="btn btn-sm btn-secondary" target="_blank"><i class="bi bi-file-text"></i> Show
                            Logs</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="col-12">
            <nav>
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${isFirst} ? 'disabled' : ''"
                        th:disabled="${isFirst}">
                        <button class="page-link" id="prev-page" th:disabled="${isFirst}">
                            Previous
                        </button>
                    </li>
                    <li class="page-item active" aria-current="page">
                        <button class="page-link" id="current-page" th:data-page="${currentPage}"
                                th:text="${currentPage} + 1"></button>
                    </li>
                    <li class="page-item" th:classappend="${isLast} ? 'disabled' : ''"
                        th:disabled="${isLast}">
                        <button class="page-link" id="next-page" th:disabled="${isLast}">Next
                        </button>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>

<footer th:replace="fragments/footer :: footer">
    <!-- FOOTER -->
</footer>

</body>
</html>
