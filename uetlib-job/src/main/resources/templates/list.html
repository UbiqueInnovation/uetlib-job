<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="en">
<!--suppress HtmlRequiredTitleElement -->
<head th:replace="fragments/head :: head">
    <!-- HEAD -->
</head>
<body th:attr="onload=${triggeredJobName} ? ('showToast(\'' + ${triggeredJobName} + '\', \'Job ' + ${triggeredJobClazz} + ' triggered.\')') : null">
<nav th:replace="fragments/navbar :: navbar('list')">
    <!-- Header -->
</nav>
<div class="container-fluid my-3">
    <div class="row g-3">

        <div class="table-responsive col-12">
            <table class="table table-bordered table-striped table-sm m-0">
                <thead>
                <tr>
                    <th class="text-center">ID</th>
                    <th>Name</th>
                    <th colspan="2">Cron</th>
                    <th>Started At</th>
                    <th>Finished At</th>
                    <th class="text-center">State</th>
                    <th class="text-center">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="job : ${jobs}">
                    <td class="align-middle text-center" th:text="${job.id}"></td>
                    <td class="align-middle" th:text="${job.name}"></td>
                    <td>
                        <form method="post" th:action="@{/status/job/{className}/update(className=${job.clazz})}">
                            <div class="input-group input-group-sm has-validation">
                                <input type="text" class="form-control" placeholder="Cron expression"
                                       id="cronExpression"
                                       name="cronExpression" size="10"
                                       th:classappend="${job.isCronExpressionValid() ? '' : 'is-invalid'}"
                                       th:value="${job.cronExpression}">
                                <label for="cronExpression" hidden>Cron Expression</label>
                                <button class="btn btn-outline-secondary" value="submit">Save</button>
                                <div class="invalid-feedback" th:if="${!job.isCronExpressionValid()}">
                                    Invalid Expression
                                </div>
                            </div>

                        </form>
                    </td>
                    <td class="align-middle text-center">
                        <div class="badge bg-success" th:if="${job.isCronActive()}">
                            Active
                        </div>
                        <div class="badge bg-warning" th:if="${!job.isCronActive()}">
                            Inactive
                        </div>
                    </td>
                    <td class="align-middle" th:text="${#temporals.format(latestJobRuns.get(job.id)?.startedAtZoned, 'dd. MMM. yyyy HH:mm')}"></td>
                    <td class="align-middle " th:text="${#temporals.format(latestJobRuns.get(job.id)?.finishedAtZoned, 'dd. MMM. yyyy HH:mm')}"></td>
                    <td class="align-middle text-center">
                        <div th:if="${latestJobRuns.get(job.id) != null}">
                            <span th:class="'badge bg-'+${jobRunStateColors.get(latestJobRuns.get(job.id).state)}"
                                  th:text="${latestJobRuns.get(job.id).state}"/>
                        </div>
                    </td>
                    <td class="align-middle text-center">
                        <a th:href="@{/status/job/{className}/start(className=${job.clazz})}"
                           class="startJob btn btn-success btn-sm"
                           th:attr="data-bs-toggle=${forceRunnableJobs.get(job.id) ? 'modal' : null},
                                        data-bs-target=${forceRunnableJobs.get(job.id) ? '#startNowModal' : null}">
                            <i class="bi bi-play-fill"></i> Start now
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<!-- Modal -->
<div class="modal fade" id="startNowModal" tabindex="-1" aria-labelledby="startNowModalTitle" aria-hidden="true">
    <div class="modal-dialog">
        <!-- Modal content-->
        <div class="modal-content">
            <div class="modal-header">
                <h4 id="startNowModalTitle" class="modal-title">Modal Header</h4>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-footer">
                <a id="forceRun" class="btn btn-danger"><i class="bi bi-exclamation-octagon-fill"></i> Force run</a>
                <a id="skipIfUnchanged" class="btn btn-primary"><i class="bi bi-skip-end-circle-fill"></i> Skip if unchanged</a>
            </div>
        </div>
    </div>


</div>

<!-- toasts -->
<div aria-live="polite" aria-atomic="true">
    <div class="toast-container position-absolute top-0 end-0 p-3" id="toast-container"></div>
</div>

<footer th:replace="fragments/footer :: footer">
    <!-- FOOTER -->
</footer>

</body>
</html>
